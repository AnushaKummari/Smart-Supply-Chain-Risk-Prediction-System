server:
  port: 8080

spring:
  application:
    name: ssrp-backend
  datasource:
    url: jdbc:postgresql://postgres-db:5432/ssrp_db
    username: ssrp_user
    password: ssrp_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

ssrp:
  ml-service:
    base-url: http://python-ml-service:5000

logging:
  level:
    root: INFO
    org.springframework.security: INFO

